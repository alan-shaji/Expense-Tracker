.tw{overflow-x:auto}

.neg{color:var(--ng);font-weight:600;cursor:pointer;background:none;border:0}
.pos{color:var(--ps);font-weight:600;cursor:pointer;background:none;border:0}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}

</style>
</head>
